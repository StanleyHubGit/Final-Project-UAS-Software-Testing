<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h2>Register</h2>

<input id="username" class="form-control" placeholder="Username">
<input id="password" type="password" class="form-control mt-2" placeholder="Password">
<small class="text-muted">
    Password minimal 8 karakter, harus mengandung huruf, angka, dan simbol.
</small>

<div>
    <button onclick="register()" class="btn btn-primary mt-2">Register</button>
</div>

<p class="mt-3">
    Sudah punya akun?
    <a href="/login-page">Login di sini</a>
</p>

<div id="alertBox" class="mt-3"></div>

<script>
async function register() {
    const res = await fetch('/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            username: username.value,
            password: password.value
        })
    });

    const data = await res.json();
    const alertBox = document.getElementById('alertBox');

    if (res.status === 201) {
        alertBox.innerHTML = `
            <div class="alert alert-success">
                Register berhasil! Redirect ke login...
            </div>
        `;
        setTimeout(() => {
            window.location.href = "/login-page";
        }, 1500);
    } else {
        alertBox.innerHTML = `
            <div class="alert alert-danger">
                ${data.error}
            </div>
        `;
    }
}
</script>

</body>
</html>
