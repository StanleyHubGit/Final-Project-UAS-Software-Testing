<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<div class="d-flex justify-content-between align-items-center mb-4"></div>

<h2>Task Manager</h2>

<input id="taskInput" class="form-control" placeholder="Enter task">
<button onclick="addTask()" class="btn btn-primary mt-2">Add Task</button>
<button onclick="logout()" class="btn btn-danger mt-2">Logout</button>

<ul id="taskList" class="list-group mt-3"></ul>

<script>
async function addTask() {
    const title = document.getElementById('taskInput').value;

    await fetch('/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
    });

    document.getElementById('taskInput').value = "";
    loadTasks();
}

async function completeTask(id) {
    await fetch(`/tasks/${id}`, { method: 'PUT' });
    loadTasks();
}

async function deleteTask(id) {
    await fetch(`/tasks/${id}`, { method: 'DELETE' });
    loadTasks();
}

async function loadTasks() {
    const res = await fetch('/tasks');
    const tasks = await res.json();

    const list = document.getElementById('taskList');
    list.innerHTML = '';

    tasks.forEach(t => {
        const li = document.createElement('li');
        li.className = 'list-group-item d-flex justify-content-between align-items-center';

        li.innerHTML = `
            <span style="${t.completed ? 'text-decoration: line-through;' : ''}">
                ${t.title}
            </span>

            <div>
                <button class="btn btn-success btn-sm" onclick="completeTask(${t.id})">✔</button>
                <button class="btn btn-danger btn-sm" onclick="deleteTask(${t.id})">✖</button>
            </div>
        `;

        list.appendChild(li);
    });
}

function logout() {
    window.location.href = "/logout";
}

loadTasks();
</script>

</body>
</html>
