<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* =========================
   LIGHT MODE
========================= */
body.light {
    background-color: #f5f6fa;
    color: #222;
}

/* =========================
   DARK MODE
========================= */
body.dark {
    background-color: #121212;
    color: #ffffff;
}

/* TEXT GLOBAL */
body.dark * {
    color: #ffffff;
}

/* =========================
   CARD
========================= */
.card {
    border-radius: 12px;
    border: none;
}

body.dark .card {
    background-color: #1e1e1e;
}

body.light .card {
    background-color: #ffffff;
}

/* =========================
   LIST ITEM
========================= */
body.dark .list-group-item {
    background-color: #1e1e1e;
    border: none;
}

body.light .list-group-item {
    background-color: #ffffff;
}

/* =========================
   TASK DONE
========================= */
.task-done {
    text-decoration: line-through;
    color: #888 !important;
}

/* =========================
   INPUT FIELD
========================= */
input, textarea {
    border-radius: 8px;
}

body.dark input,
body.dark textarea {
    background-color: #2c2c2c;
    color: #ffffff;
    border: 1px solid #444;
}

body.dark input::placeholder {
    color: #aaa;
}

/* =========================
   BUTTON
========================= */
.btn {
    border-radius: 8px;
}

/* =========================
   HOVER EFFECT
========================= */
.task-item:hover {
    transform: scale(1.01);
    transition: 0.2s;
}
</style>
</head>

<body class="dark container py-5">

<!-- HEADER -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3>📋 Task Manager</h3>

    <div class="d-flex align-items-center gap-2">
        <button onclick="toggleMode()" class="btn btn-secondary btn-sm">
            🌙 / ☀️
        </button>

        <span>👋 Hi, <b>{{ username.capitalize() }}</b></span>

        <button onclick="confirmLogout()" class="btn btn-danger mt-2">Logout</button>
    </div>
</div>

<!-- STATS -->
<div class="row text-center mb-4">
    <div class="col">
        <div class="card p-3">
            <h6>Total</h6>
            <h3 id="totalTask">0</h3>
        </div>
    </div>
    <div class="col">
        <div class="card p-3">
            <h6>Done</h6>
            <h3 id="doneTask">0</h3>
        </div>
    </div>
    <div class="col">
        <div class="card p-3">
            <h6>Pending</h6>
            <h3 id="pendingTask">0</h3>
        </div>
    </div>
</div>

<!-- ADD TASK -->
<div class="card p-4 shadow mb-4">
    <div class="input-group">
        <input id="taskInput" class="form-control form-control-lg" placeholder="Tambah task...">
        <button onclick="addTask()" class="btn btn-primary btn-lg">➕ Add</button>
    </div>
</div>

<!-- TASK LIST -->
<ul id="taskList" class="list-group"></ul>

<script>

// =====================
// USERNAME FROM BACKEND
// =====================
async function loadUser() {
    try {
        const res = await fetch('/me');

        if (res.status === 200) {
            const data = await res.json();
            document.getElementById("username").innerText = data.username;
        } else {
            document.getElementById("username").innerText = "Guest";
        }
    } catch {
        document.getElementById("username").innerText = "Guest";
    }
}

// =====================
// THEME
// =====================
function loadTheme() {
    const theme = localStorage.getItem("theme") || "dark";
    document.body.className = theme + " container py-5";
}

function toggleMode() {
    const current = document.body.classList.contains("dark") ? "dark" : "light";
    const newMode = current === "dark" ? "light" : "dark";

    document.body.className = newMode + " container py-5";
    localStorage.setItem("theme", newMode);
}

// =====================
// ADD TASK
// =====================
async function addTask() {
    const title = document.getElementById('taskInput').value;

    if (!title.trim()) {
        showToast("Task tidak boleh kosong");
        return;
    }

    await fetch('/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
    });

    document.getElementById('taskInput').value = "";
    loadTasks();
}

// =====================
// COMPLETE
// =====================
async function completeTask(id) {
    await fetch(`/tasks/${id}`, { method: 'PUT' });
    loadTasks();
}

// =====================
// DELETE
// =====================
async function deleteTask(id) {
    if (!confirm("Hapus task ini?")) return;

    await fetch(`/tasks/${id}`, { method: 'DELETE' });
    loadTasks();
}

// =====================
// EDIT
// =====================
async function editTask(id, oldTitle) {
    const newTitle = prompt("Edit task:", oldTitle);

    if (!newTitle || !newTitle.trim()) return;

    await fetch(`/tasks/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: newTitle })
    });

    loadTasks();
}

// =====================
// LOAD TASKS + STATS
// =====================
async function loadTasks() {
    const res = await fetch('/tasks');
    const tasks = await res.json();

    const list = document.getElementById('taskList');
    list.innerHTML = '';

    let done = 0;

    tasks.forEach(t => {
        if (t.completed) done++;

        const li = document.createElement('li');
        li.className = 'list-group-item task-item d-flex justify-content-between align-items-center mb-2';

        li.innerHTML = `
            <div>
                <span class="${t.completed ? 'task-done' : ''}">
                    ${t.title}
                </span>
                <span class="badge bg-${t.completed ? 'success' : 'secondary'} ms-2">
                    ${t.completed ? 'Done' : 'Pending'}
                </span>
            </div>

            <div class="btn-group">
                <button class="btn btn-outline-success btn-sm" onclick="completeTask(${t.id})">✔</button>
                <button class="btn btn-outline-warning btn-sm" onclick="editTask(${t.id}, '${t.title}')">✏</button>
                <button class="btn btn-outline-danger btn-sm" onclick="deleteTask(${t.id})">🗑</button>
            </div>
        `;

        list.appendChild(li);
    });

    document.getElementById('totalTask').innerText = tasks.length;
    document.getElementById('doneTask').innerText = done;
    document.getElementById('pendingTask').innerText = tasks.length - done;
}

// =====================
// TOAST
// =====================
function showToast(msg) {
    const toast = document.createElement("div");
    toast.innerText = msg;

    toast.style.position = "fixed";
    toast.style.bottom = "20px";
    toast.style.right = "20px";
    toast.style.background = "#333";
    toast.style.color = "#fff";
    toast.style.padding = "10px 15px";
    toast.style.borderRadius = "8px";

    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
}

// =====================
// LOGOUT
// =====================
function confirmLogout() {
    if (confirm("Are you sure you want to logout?")) {
        window.location.href = "/logout";
    }
}

// INIT
loadTheme();
loadUser();
loadTasks();

</script>

</body>
</html>
