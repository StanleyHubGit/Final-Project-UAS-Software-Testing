<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body.light {
    background-color: #f5f6fa;
    color: #222;
}

body.dark {
    background-color: #121212;
    color: #fff;
}

body.dark input {
    background-color: #2c2c2c !important;
    color: #ffffff !important;
    border: 1px solid #555;
}

body.dark input::placeholder {
    color: #aaaaaa !important;
}

body.dark input:focus {
    background-color: #2c2c2c !important;
    color: #ffffff !important;
    border-color: #0d6efd;
    box-shadow: none;
}

body.dark input:-webkit-autofill {
    -webkit-box-shadow: 0 0 0 1000px #2c2c2c inset !important;
    -webkit-text-fill-color: #ffffff !important;
}

.card {
    border-radius: 12px;
}

</style>
</head>

<body class="dark d-flex justify-content-center align-items-center vh-100">

<div class="card p-4 shadow" style="width: 380px;">

    <div class="d-flex justify-content-between mb-3">
        <h4>🔐 Login</h4>
        <button onclick="toggleMode()" class="btn btn-sm btn-secondary">🌙/☀️</button>
    </div>

    <input id="username" class="form-control mb-2" placeholder="Username">
    <input id="password" type="password" class="form-control mb-2" placeholder="Password">

    <button onclick="login()" class="btn btn-success w-100">Login</button>

    <p class="text-center mt-3">
        Belum punya akun?
        <a href="/register-page">Register</a>
    </p>

</div>

<script>
// THEME
function loadTheme() {
    const theme = localStorage.getItem("theme") || "dark";
    document.body.className = theme + " d-flex justify-content-center align-items-center vh-100";
}

function toggleMode() {
    const current = document.body.classList.contains("dark") ? "dark" : "light";
    const newMode = current === "dark" ? "light" : "dark";

    document.body.className = newMode + " d-flex justify-content-center align-items-center vh-100";
    localStorage.setItem("theme", newMode);
}

// LOGIN
async function login() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    });

    if (res.status === 200) {
        localStorage.setItem("username", username);
        window.location.href = "/";
    } else {
        alert("Login gagal!");
    }
}

loadTheme();
</script>

</body>
</html>
