<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h2>Login</h2>

<input id="username" class="form-control" placeholder="Username">
<input id="password" type="password" class="form-control mt-2" placeholder="Password">

<button onclick="login()" class="btn btn-success mt-2">Login</button>

<p id="message" class="mt-3"></p>

<p class="mt-3">
    Belum punya akun?
    <a href="/register-page">Register di sini</a>
</p>

<script>
async function login() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    });

    if (res.status === 200) {
        // SIMPAN USERNAME
        localStorage.setItem("username", username);

        window.location.href = "/";
    } else {
        alert("Login gagal!");
    }
}

async function register() {
    const res = await fetch('/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            username: username.value,
            password: password.value
        })
    });

    const data = await res.json();
    message.innerText = data.message || data.error;
}
</script>

</body>
</html>
